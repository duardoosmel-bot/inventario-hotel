  .print-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }

<body>
<div id="app"></div>
<div id="print-area"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
/* ---------- constantes fijas ---------- */
const API_URL = "https://script.google.com/macros/s/AKfycbw6Nq9u7QmakEosqkVMY0u8GlwcGpn4QL7xJ1Jc8-mvULC_i33IWtaXX0wfc708txnKFw/exec";

/* ---------- Firebase (migracion progresiva fuera de Google Sheets) ----------
   Fase 1: Puntos de venta (nombre, PIN, ratioUsd, pesoBase) viven en Firestore.
   El resto (Log, transferencias, menu, correos, config general) sigue en Apps Script
   por ahora -- se migra en fases siguientes. */
const firebaseConfig = {
  apiKey: "AIzaSyCMtkOoVsvPaNXNWUDyGr85ZGvwSTTg4Ws",
  authDomain: "ipv-hotel.firebaseapp.com",
  projectId: "ipv-hotel",
  storageBucket: "ipv-hotel.firebasestorage.app",
  messagingSenderId: "700821643987",
  appId: "1:700821643987:web:dacab069ef6c8608c32a26"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let firebaseAuthReady = null;
function ensureFirebaseAuth() {
  if (!firebaseAuthReady) {
    firebaseAuthReady = new Promise((resolve, reject) => {
      firebase.auth().onAuthStateChanged((user) => { if (user) resolve(user); });
      firebase.auth().signInAnonymously().catch(reject);
    });
  }
  return firebaseAuthReady;
}
const ADMIN_PASS = "4MvBgra3**";
const ORDER_EMAIL = "zanba1@iberostar.com";

/* ---------- Fase 3: Log de conteos en Firestore ----------
   logEntries/{fecha}_{punto}_{productoId} -> ledger historico completo (para Score/export).
   currentState/{punto}_{productoId} -> SIEMPRE el ultimo estado conocido de ese producto en
     ese punto (se sobreescribe en cada guardado). Leer esto es rapido sin importar cuantos
     dias de historial haya, porque solo trae los productos de ESE punto, no todo el historial.
   puntoStatus/{punto} -> { fechaUltimoCierre } para el chequeo instantaneo de "ya cerro hoy". */

async function fetchCurrentState(punto) {
  await ensureFirebaseAuth();
  const snap = await db.collection("currentState").where("punto", "==", punto).get();
  const items = [];
  snap.forEach((doc) => items.push(doc.data()));
  return items;
}
async function fetchPuntoStatus(punto) {
  await ensureFirebaseAuth();
  const doc = await db.collection("puntoStatus").doc(punto).get();
  if (!doc.exists) return { fechaUltimoCierre: "", fechaJornadaAbierta: "" };
  const d = doc.data();
  return { fechaUltimoCierre: d.fechaUltimoCierre || "", fechaJornadaAbierta: d.fechaJornadaAbierta || "" };
}
async function fetchFechaUltimoCierre(punto) {
  return (await fetchPuntoStatus(punto)).fechaUltimoCierre;
}
// Tipo de cambio EUR->USD del dia. Se busca en vivo la primera vez que hace falta ese dia
// y se guarda en Firestore para que todos usen la misma tasa el resto del dia (sin pegarle
// a la API cada vez). API sin llave, gratis, del Banco Central Europeo (frankfurter.app).
async function fetchTipoCambio(fecha) {
  await ensureFirebaseAuth();
  try {
    const doc = await db.collection("tipoCambio").doc(fecha).get();
    if (doc.exists && doc.data().eurUsd) return doc.data().eurUsd;
  } catch (e) { /* sigue al intento en vivo */ }
  try {
    const res = await fetch("https://api.frankfurter.app/latest?from=EUR&to=USD");
    const data = await res.json();
    const rate = data.rates && data.rates.USD;
    if (rate) { db.collection("tipoCambio").doc(fecha).set({ eurUsd: rate }).catch(() => {}); return rate; }
  } catch (e) { /* sin internet a la API o fallo -- se devuelve null */ }
  return null;
}
// Adultos y Ninos del dia (cifra de todo el hotel, solo la carga Admin). Los adultos valen
// la suma de los ratios EUR de todos los puntos (ya configurados en Admin -> Puntos de
// venta); los ninos valen el 50% de eso. Siempre es la fecha de HOY.
async function loadClientesAdultosNinos() {
  try {
    await ensureFirebaseAuth();
    const doc = await db.collection("clientesDia").doc(TODAY).get();
    if (doc.exists) {
      const d = doc.data();
      state.adultosInput = d.adultos ? String(d.adultos) : "";
      state.ninosInput = d.ninos ? String(d.ninos) : "";
    } else {
      state.adultosInput = ""; state.ninosInput = "";
    }
  } catch (e) { /* silencioso */ }
  rerender();
}
async function adminSaveClientesAdultosNinos() {
  state.clientesDiaStatus = { state: "loading", msg: t("admin_saving") };
  rerender();
  try {
    await ensureFirebaseAuth();
    await db.collection("clientesDia").doc(TODAY).set({ adultos: parseNumber(state.adultosInput), ninos: parseNumber(state.ninosInput) });
    state.clientesDiaStatus = { state: "ok", msg: t("clientes_dia_saved") };
  } catch (e) {
    state.clientesDiaStatus = { state: "error", msg: t("admin_save_error", { msg: e.message }) };
  }
  rerender();
}
// Guarda un IPV (o control) directo en Firestore: escribe el renglon historico y actualiza
// el "ultimo estado" de cada producto de una sola vez, en un batch atomico.
async function saveLogBatch(punto, fecha, responsable, items, tipo, clientesDia) {
  await ensureFirebaseAuth();
  const batch = db.batch();
  const now = firebase.firestore.FieldValue.serverTimestamp();
  items.forEach((it) => {
    const logId = `${fecha}_${punto}_${it.productId}`;
    batch.set(db.collection("logEntries").doc(logId), {
      fecha, punto, productoId: it.productId, producto: it.producto, marca: it.marca || "", categoria: it.categoria || "",
      unidad: it.unidad, modo: it.modo || "", inicial: it.inicial, entradas: it.entradas, final: it.final,
      consumo: it.consumo, costoUnitario: it.costoUnitario, costoConsumo: it.costoConsumo,
      consumoMl: it.consumoMl || 0, consumoG: it.consumoG || 0, responsable: responsable || "",
      timestamp: now, codigo: it.codigo || "", pedido: it.pedido || 0, tipo, clientesDia: clientesDia || 0
    });
    const stateId = `${punto}_${it.productId}`;
    batch.set(db.collection("currentState").doc(stateId), {
      punto, productoId: it.productId, producto: it.producto, marca: it.marca || "", categoria: it.categoria || "",
      unidad: it.unidad, modo: it.modo || "", costoUnitario: it.costoUnitario, codigo: it.codigo || "", inicial: it.final
    });
  });
  if (tipo === "regular") batch.set(db.collection("puntoStatus").doc(punto), { fechaUltimoCierre: fecha }, { merge: true });
  await batch.commit();
}
// Apertura: registra Inicial + Entradas (se puede repetir varias veces en el dia, cada vez
// se sobreescribe con el total acumulado que ve la persona en pantalla). No toca Final, no
// bloquea el dia, no actualiza currentState (todavia no hay un cierre real que fije el stock).
async function saveAperturaBatch(punto, fecha, responsableApertura, items) {
  await ensureFirebaseAuth();
  const batch = db.batch();
  const now = firebase.firestore.FieldValue.serverTimestamp();
  items.forEach((it) => {
    const logId = `${fecha}_${punto}_${it.productId}`;
    batch.set(db.collection("logEntries").doc(logId), {
      fecha, punto, productoId: it.productId, producto: it.producto, marca: it.marca || "", categoria: it.categoria || "",
      unidad: it.unidad, modo: it.modo || "", inicial: it.inicial, entradas: it.entradas,
      costoUnitario: it.costoUnitario, codigo: it.codigo || "",
      responsableApertura: responsableApertura || "", timestampApertura: now
    }, { merge: true });
  });
  // marca esta fecha como la jornada abierta de este punto -- asi, si alguien recarga la
  // app en un dia distinto ANTES de cerrar, la app sigue mostrando y editando ESTA jornada
  // (no la de "hoy"). Se limpia solo cuando se cierra (ver saveCierreBatch).
  batch.set(db.collection("puntoStatus").doc(punto), { fechaJornadaAbierta: fecha }, { merge: true });
  await batch.commit();
}
// Cierre de jornada: exige Final, calcula consumo, SI bloquea el dia (fechaUltimoCierre) y
// actualiza currentState (el "final" de hoy pasa a ser el "inicial" para la proxima jornada).
async function saveCierreBatch(punto, fecha, responsableCierre, items) {
  await ensureFirebaseAuth();
  const batch = db.batch();
  const now = firebase.firestore.FieldValue.serverTimestamp();
  items.forEach((it) => {
    const logId = `${fecha}_${punto}_${it.productId}`;
    batch.set(db.collection("logEntries").doc(logId), {
      fecha, punto, productoId: it.productId, producto: it.producto, marca: it.marca || "", categoria: it.categoria || "",
      unidad: it.unidad, modo: it.modo || "", inicial: it.inicial, entradas: it.entradas, final: it.final,
      consumo: it.consumo, costoUnitario: it.costoUnitario, costoConsumo: it.costoConsumo,
      consumoMl: it.consumoMl || 0, consumoG: it.consumoG || 0, transferSalida: it.transferSalida || 0,
      responsableCierre: responsableCierre || "", timestampCierre: now, codigo: it.codigo || "",
      pedido: it.pedido || 0, tipo: "regular"
    }, { merge: true });
    const stateId = `${punto}_${it.productId}`;
    batch.set(db.collection("currentState").doc(stateId), {
      punto, productoId: it.productId, producto: it.producto, marca: it.marca || "", categoria: it.categoria || "",
      unidad: it.unidad, modo: it.modo || "", costoUnitario: it.costoUnitario, codigo: it.codigo || "", inicial: it.final
    });
  });
  batch.set(db.collection("puntoStatus").doc(punto), { fechaUltimoCierre: fecha, fechaJornadaAbierta: firebase.firestore.FieldValue.delete() }, { merge: true });
  await batch.commit();
}
// Query de un dia completo (Score diario): trae solo las filas de esa fecha, indexado.
async function fetchDailyScore(fecha) {
  await ensureFirebaseAuth();
  const snap = await db.collection("logEntries").where("fecha", "==", fecha).get();
  const byPunto = {}, byCategoria = {};
  snap.forEach((doc) => {
    const d = doc.data();
    const punto = d.punto, categoria = d.categoria || t("no_category");
    const consumoMl = d.consumoMl || 0, consumoG = d.consumoG || 0, costoConsumo = d.costoConsumo || 0;
    if (!byPunto[punto]) byPunto[punto] = { punto, costoTotal: 0, consumoMl: 0, consumoG: 0 };
    byPunto[punto].costoTotal += costoConsumo; byPunto[punto].consumoMl += consumoMl; byPunto[punto].consumoG += consumoG;
    if (!byCategoria[categoria]) byCategoria[categoria] = { categoria, costoTotal: 0, consumoMl: 0, consumoG: 0 };
    byCategoria[categoria].costoTotal += costoConsumo; byCategoria[categoria].consumoMl += consumoMl; byCategoria[categoria].consumoG += consumoG;
  });
  return { puntos: Object.values(byPunto), categorias: Object.values(byCategoria) };
}
// Detalle completo de un punto en un dia especifico (para ver/exportar un IPV puntual).
async function fetchReportDetail(fecha, punto) {
  await ensureFirebaseAuth();
  const snap = await db.collection("logEntries").where("fecha", "==", fecha).where("punto", "==", punto).get();
  const items = []; let responsable = "", responsableApertura = "", responsableCierre = "", clientesDia = 0;
  snap.forEach((doc) => {
    const d = doc.data();
    if (d.responsable) responsable = d.responsable;
    if (d.responsableApertura) responsableApertura = d.responsableApertura;
    if (d.responsableCierre) responsableCierre = d.responsableCierre;
    if (d.clientesDia) clientesDia = d.clientesDia;
    items.push(d);
  });
  return { punto, fecha, responsable, responsableApertura, responsableCierre, clientesDia, items };
}
// Sugerencia de pedido automatico por producto: promedia el consumo historico de ese punto
// por "cliente-equivalente" (Adultos + Ninos x 0.5, prorrateado por el Peso Base del punto)
// y lo proyecta contra los Adultos/Ninos de HOY para estimar cuanto se deberia consumir.
// El minimo sugerido agrega un 25% de colchon de seguridad (estandar de la industria para
// par level en F&B); el maximo es el minimo mas un ciclo de reposicion tipico (50% extra).
const ORDER_SUGGESTION_SAFETY_MARGIN = 0.25;
async function fetchOrderSuggestion(punto) {
  await ensureFirebaseAuth();
  const pesoBase = state.puntoPesos[punto] || 0;
  if (pesoBase <= 0) return { error: "no_peso_base", items: [] };
  const logSnap = await db.collection("logEntries").where("punto", "==", punto).where("tipo", "==", "regular").orderBy("fecha", "desc").limit(1500).get();
  const byProduct = {}; // productoId -> { porFecha: {fecha: consumo}, meta }
  const fechasSet = new Set();
  logSnap.forEach((doc) => {
    const d = doc.data();
    fechasSet.add(d.fecha);
    if (!byProduct[d.productoId]) byProduct[d.productoId] = { porFecha: {}, meta: d };
    byProduct[d.productoId].porFecha[d.fecha] = d.consumo || 0;
    byProduct[d.productoId].meta = d; // se queda con el dato mas reciente (nombre, unidad, costo pueden cambiar)
  });
  const fechas = Array.from(fechasSet);
  if (fechas.length === 0) return { error: "sin_historial", items: [] };
  const clientesPorFecha = {};
  await Promise.all(fechas.map(async (f) => {
    try {
      const doc = await db.collection("clientesDia").doc(f).get();
      if (doc.exists) clientesPorFecha[f] = doc.data();
    } catch (e) {}
  }));
  const clientesEquivHoy = (parseNumber(state.adultosInput) + parseNumber(state.ninosInput) * 0.5) * (pesoBase / 100);
  const items = [];
  Object.keys(byProduct).forEach((productoId) => {
    const { porFecha, meta } = byProduct[productoId];
    let sumaRatios = 0, dias = 0;
    Object.keys(porFecha).forEach((f) => {
      const cd = clientesPorFecha[f];
      if (!cd) return;
      const clientesEquivEseDia = ((cd.adultos || 0) + (cd.ninos || 0) * 0.5) * (pesoBase / 100);
      if (clientesEquivEseDia <= 0) return;
      sumaRatios += porFecha[f] / clientesEquivEseDia;
      dias++;
    });
    if (dias === 0) return;
    const ratioPromedio = sumaRatios / dias;
    const cantidadEsperada = ratioPromedio * clientesEquivHoy;
    const minimo = cantidadEsperada * (1 + ORDER_SUGGESTION_SAFETY_MARGIN);
    items.push({
      productoId, producto: meta.producto, marca: meta.marca || "", categoria: meta.categoria || "", unidad: meta.unidad || "",
      dias, ratioPromedio, cantidadEsperada, minimo, maximo: minimo * 1.5
    });
  });
  items.sort((a, b) => b.minimo - a.minimo);
  return { error: null, clientesEquivHoy, diasHistorial: fechas.length, items };
}
// Resta stock del punto de origen de una transferencia (reemplaza applyOutboundTransfer
// que antes vivia en Apps Script, ahora que el Log esta en Firestore).
async function adjustOriginStock(puntoOrigen, fecha, items, signo) {
  await ensureFirebaseAuth();
  const batch = db.batch();
  const now = firebase.firestore.FieldValue.serverTimestamp();
  for (const it of items) {
    const cantidad = (Number(it.cantidadEnviada) || 0) * signo;
    if (cantidad === 0) continue;
    const logId = `${fecha}_${puntoOrigen}_${it.productoId}`;
    const logDoc = await db.collection("logEntries").doc(logId).get();
    const stateId = `${puntoOrigen}_${it.productoId}`;
    if (logDoc.exists) {
      const d = logDoc.data();
      const nuevoFinal = (d.final || 0) - cantidad;
      const nuevoConsumo = (d.inicial || 0) + (d.entradas || 0) - nuevoFinal;
      const nuevoCosto = nuevoConsumo * (d.costoUnitario || 0);
      batch.set(db.collection("logEntries").doc(logId), { final: nuevoFinal, consumo: nuevoConsumo, costoConsumo: nuevoCosto }, { merge: true });
      batch.set(db.collection("currentState").doc(stateId), { inicial: nuevoFinal }, { merge: true });
    } else {
      const stateDoc = await db.collection("currentState").doc(stateId).get();
      const inicial = stateDoc.exists ? (stateDoc.data().inicial || 0) : 0;
      const costoUnitario = stateDoc.exists ? (stateDoc.data().costoUnitario || 0) : (it.costoUnitario || 0);
      const finalNuevo = inicial - cantidad;
      const consumoNuevo = inicial - finalNuevo;
      batch.set(db.collection("logEntries").doc(logId), {
        fecha, punto: puntoOrigen, productoId: it.productoId, producto: it.producto, marca: it.marca || "", categoria: it.categoria || "",
        unidad: it.unidad || "", modo: "each", inicial, entradas: 0, final: finalNuevo, consumo: consumoNuevo,
        costoUnitario, costoConsumo: consumoNuevo * costoUnitario, consumoMl: 0, consumoG: 0,
        responsable: "Transferencia", timestamp: now, codigo: it.codigo || "", pedido: 0, tipo: "transferencia_salida", clientesDia: 0
      });
      batch.set(db.collection("currentState").doc(stateId), {
        punto: puntoOrigen, productoId: it.productoId, producto: it.producto, marca: it.marca || "", categoria: it.categoria || "",
        unidad: it.unidad || "", modo: "each", costoUnitario, codigo: it.codigo || "", inicial: finalNuevo
      }, { merge: true });
    }
  }
  await batch.commit();
}
async function applyOutboundTransferClient(puntoOrigen, fecha, items) {
  return adjustOriginStock(puntoOrigen, fecha, items, 1);
}
// Rechazo de un item de una transferencia pendiente: devuelve la cantidad al stock del
// punto de origen (reversa exacta de lo que se resto al crear la transferencia).
async function returnToOriginStock(puntoOrigen, fecha, item) {
  return adjustOriginStock(puntoOrigen, fecha, [item], -1);
}

/* ---------- Fase 4: transferencias entre puntos en Firestore ----------
   transferencias/{autoId} -> fecha, punto (destino), puntoOrigen, datos del producto,
   cantidadEnviada, cantidadRecibida, estado ("pendiente"/"confirmada"). El correo de aviso
   sigue enviandose via Apps Script (el envio de correos aun no se migro). */
async function fetchPendingTransfers(punto) {
  await ensureFirebaseAuth();
  const snap = await db.collection("transferencias").where("punto", "==", punto).where("estado", "==", "pendiente").get();
  const items = [];
  snap.forEach((doc) => items.push({ id: doc.id, ...doc.data() }));
  return items;
}
async function createTransferInFirestore(punto, puntoOrigen, fecha, items) {
  await ensureFirebaseAuth();
  const batch = db.batch();
  items.forEach((it) => {
    const ref = db.collection("transferencias").doc();
    batch.set(ref, {
      fecha, punto, puntoOrigen: puntoOrigen || "", productoId: it.productoId, producto: it.producto, marca: it.marca || "",
      categoria: it.categoria || "", unidad: it.unidad || "", costoUnitario: it.costoUnitario || 0, codigo: it.codigo || "",
      cantidadEnviada: it.cantidadEnviada || 0, cantidadRecibida: 0, estado: "pendiente",
      timestampCreado: firebase.firestore.FieldValue.serverTimestamp(), timestampConfirmado: null
    });
  });
  await batch.commit();
}
async function confirmTransfersInFirestore(items) {
  await ensureFirebaseAuth();
  const batch = db.batch();
  items.forEach((it) => {
    batch.set(db.collection("transferencias").doc(it.id), { cantidadRecibida: it.cantidadRecibida || 0, estado: "confirmada", timestampConfirmado: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
  });
  await batch.commit();
}

function t(key, vars) {
  const dict = I18N[state.lang] || I18N.es;
  let str = dict[key] !== undefined ? dict[key] : (I18N.es[key] || key);
  if (vars) Object.keys(vars).forEach((k) => { str = str.split("{" + k + "}").join(vars[k]); });
  return str;
}

const fmt2 = (n) => (Number.isFinite(n) ? n.toFixed(2) : "0.00");
function parseNumber(val) {
  if (val === null || val === undefined) return 0;
  if (typeof val === "number") return val;
  const cleaned = String(val).replace(/[^0-9.,-]/g, "").trim();
  if (!cleaned) return 0;
  let s = cleaned;
  if (s.includes(",") && s.includes(".")) {
    if (s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g, "").replace(",", ".");
    else s = s.replace(/,/g, "");
  } else if (s.includes(",")) { s = s.replace(",", "."); }
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : 0;
}
function normKey(s) {
  return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
}
function normalizeUnit(rawUnit) {
  const u = normKey(rawUnit);
  if (["l","lt","lts","litro","litros"].includes(u)) return { unidad: "ml", factor: 1000, esMedida: true };
  if (["kg","kilo","kilos","kilogramo","kilogramos"].includes(u)) return { unidad: "g", factor: 1000, esMedida: true };
  if (["ml","mililitro","mililitros"].includes(u)) return { unidad: "ml", factor: 1, esMedida: true };
  if (["g","gr","grs","gramo","gramos"].includes(u)) return { unidad: "g", factor: 1, esMedida: true };
  return { unidad: rawUnit || "unidad", factor: 1, esMedida: false };
}

function parseSheet(csvText, esBev) {

  for (let r = 0; r < Math.min(rows.length, 15); r++) {
    const row = rows[r]; const found = {};
    row.forEach((cell, c) => { const key = normKey(cell); if (HEADER_MAP[key]) found[HEADER_MAP[key]] = c; });
    if (found.producto !== undefined && found.precioFinalUSD !== undefined) { headerRowIdx = r; colMap = found; break; }
  }
  if (headerRowIdx === -1) throw new Error("No se encontraron los encabezados esperados en esta hoja.");
  const products = [];
  for (let r = headerRowIdx + 1; r < rows.length; r++) {
    const row = rows[r];
    const producto = (row[colMap.producto] || "").trim();
    if (!producto) continue;
    const cantidadRaw = parseNumber(row[colMap.cantidadMl]);
    const precioFinalUSD = parseNumber(row[colMap.precioFinalUSD]);
    const unidadRaw = (colMap.unidadVenta !== undefined ? row[colMap.unidadVenta] : "") ? String(row[colMap.unidadVenta]).trim() : "";
    const norm = normalizeUnit(unidadRaw);
    const cantidadBase = cantidadRaw * norm.factor;
    const categoria = (colMap.categoria !== undefined ? row[colMap.categoria] : "") ? String(row[colMap.categoria]).trim() : "";
    const codigo = (colMap.codigo !== undefined ? row[colMap.codigo] : "") ? String(row[colMap.codigo]).trim() : "";
    if (esBev) {
      const { cost, invalid } = sanitizeCost(precioFinalUSD);
      products.push({
        id: `${r}-${producto}`,
        codigo,
        marca: (colMap.marca !== undefined ? row[colMap.marca] : "") ? String(row[colMap.marca]).trim() : "",
        categoria, subcategoria: (colMap.subcategoria !== undefined ? row[colMap.subcategoria] : "") ? String(row[colMap.subcategoria]).trim() : "",
        producto,
        modo: "each",

        codigo,
        marca: (colMap.marca !== undefined ? row[colMap.marca] : "") ? String(row[colMap.marca]).trim() : "",
        categoria, subcategoria: (colMap.subcategoria !== undefined ? row[colMap.subcategoria] : "") ? String(row[colMap.subcategoria]).trim() : "",
        producto,
        modo: "medida",
        unidad: norm.unidad,
        mlPorUnidad: 0,
        costPerUnit: cost,
        priceInvalid: invalid

    } else {
      // Unidad de venta no es peso/volumen reconocido (ej. "Unidad", "Paquete", "Caja") -> se cuenta por unidad completa
      const { cost, invalid } = sanitizeCost(precioFinalUSD);
      products.push({
        id: `${r}-${producto}`,
        codigo,
        marca: (colMap.marca !== undefined ? row[colMap.marca] : "") ? String(row[colMap.marca]).trim() : "",
        categoria, subcategoria: (colMap.subcategoria !== undefined ? row[colMap.subcategoria] : "") ? String(row[colMap.subcategoria]).trim() : "",
        producto,
        modo: "each",

}

function normalizeTextForMatch(s) {

    .replace(/[^a-z0-9 ]/g, " ")

// Ubica la cantidad despachada/enviada en una linea de documento con varias columnas
// numericas (codigo, formato/tamano, cant., costo, valor...). Estrategia: encuentra donde
// empieza la "zona de costos" (primer numero tipo dinero con 2 decimales) y toma el numero
// entero suelto justo antes de esa zona -- ahi es donde casi siempre esta la cantidad en
// facturas/requisiciones/reportes de stock. Si los dos ultimos numeros antes del costo son
// iguales (patron comun: cant. solicitada = cant. despachada), usa ese valor.
function extractQuantityNear(line) {
  const moneyRe = /\d+\.\d{2}\b/g;
  let firstMoneyIndex = null;
  const mm = moneyRe.exec(line);
  if (mm) firstMoneyIndex = mm.index;

  const intRe = /(?:^|[\s(])(\d{1,4})(?:[\s)]|$)/g;
  const candidates = [];
  let im;
  while ((im = intRe.exec(line))) candidates.push({ val: parseInt(im[1], 10), index: im.index });

  let pool = firstMoneyIndex !== null ? candidates.filter((c) => c.index < firstMoneyIndex) : candidates;
  if (pool.length === 0) pool = candidates;
  if (pool.length === 0) return 1;
  return pool[pool.length - 1].val;
}
// Igual que extractQuantityNear pero devuelve el PAR solicitado/despachado cuando el
// documento trae ambas columnas (ej. "CANT.REQ. CANT.DESP."). Si solo hay un numero
// disponible, ambos quedan iguales.
function extractQuantityPair(line) {
  // Prioridad: numero seguido de una unidad conocida CON espacio real de por medio
  // (ej. "12 BOTTLE"). El espacio es clave: tamaños de producto van pegados sin espacio
  // ("330ml", "1.5L", "1Lt") y no deben confundirse con la cantidad. Con esto tambien se
  // ignora cualquier otro numero suelto en la linea (codigos, numeros de referencia/REQ, etc).
  const unitRe = /(\d+(?:\.\d+)?)\s+(BOTTLES?|PKTS?|KGS?|GRS?|LTS?|ML|EACH|PCS?|CASES?|BOX(?:ES)?|BAGS?|CTNS?|CARTONS?|UNITS?|DOZ|DZ|PACKS?|ROLLS?|TINS?|CANS?|JARS?|GAL(?:S|LONS?)?)\b/i;
  const um = unitRe.exec(line);
  if (um) { const v = parseFloat(um[1]); return { solicitada: v, despachada: v }; }
  // Sin unidad reconocida: metodo anterior (posicional) como respaldo.
  const moneyRe = /\d+\.\d{2}\b/g;
  let firstMoneyIndex = null;
  const mm = moneyRe.exec(line);
  if (mm) firstMoneyIndex = mm.index;
  const intRe = /(?:^|[\s(])(\d{1,4})(?:[\s)]|$)/g;
  const candidates = [];
  let im;
  while ((im = intRe.exec(line))) candidates.push({ val: parseInt(im[1], 10), index: im.index });
  let pool = firstMoneyIndex !== null ? candidates.filter((c) => c.index < firstMoneyIndex) : candidates;
  if (pool.length === 0) pool = candidates;
  if (pool.length === 0) return { solicitada: 1, despachada: 1 };
  if (pool.length === 1) return { solicitada: pool[0].val, despachada: pool[0].val };
  return { solicitada: pool[pool.length - 2].val, despachada: pool[pool.length - 1].val };
}

function matchScorePrecomputed(prodTokens, normProd, lineTokenSet, normLine) {
  if (prodTokens.length === 0 || lineTokenSet.size === 0) return { score: 0, hits: 0 };
  let hits = 0;
  prodTokens.forEach((w) => { if (lineTokenSet.has(w)) hits++; });
  const coverage = hits / prodTokens.length;
  const substringBonus = normLine.includes(normProd) && normProd.length > 3 ? 0.25 : 0;
  const specificityFactor = 0.5 + 0.5 * Math.min(hits, 3) / 3;
  const score = Math.min(1, (coverage + substringBonus) * specificityFactor);
  return { score, hits };
}
function matchScore(productText, line) {

  return matchScorePrecomputed(a, normalizeTextForMatch(productText), bSet, normalizeTextForMatch(line));
}
async function extractPdfText(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const lines = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    let current = "";
    content.items.forEach((it) => {
      current += it.str + " ";
      if (it.hasEOL) { lines.push(current.trim()); current = ""; }
    });
    if (current.trim()) lines.push(current.trim());
  }
  return reconstructRows(lines.filter((l) => l.length > 2));
}
// Muchos reportes de inventario/stock envuelven el nombre del producto en varias
// líneas y terminan la fila real con un número (cantidad/valor). Unimos esas
// líneas partidas en una sola fila lógica cuando ese patrón es consistente.
function reconstructRows(rawLines) {
  // Separa columnas de PDF pegadas sin espacio, comun cuando el codigo SKU queda
  // inmediatamente junto a la descripcion (ej. "BEVBER-011Beer" -> "BEVBER-011 Beer").
  // Sin esto, palabras clave del nombre del producto quedan fusionadas al codigo y
  // el comparador de texto no las reconoce como palabra independiente.
  rawLines = rawLines.map((l) => l.replace(/(\d)([A-Z])/g, "$1 $2"));
  // Quita numeracion de items al inicio de linea (ej. "1) Producto..." -> "Producto...").
  // Sin esto, ese numero de linea se confunde con una cantidad al extraer los valores.
  rawLines = rawLines.map((l) => l.replace(/^\d{1,3}\)\s*/, ""));
  const endsWithNumber = /\d[\d.,]*\s*$/;
  const withNumberCount = rawLines.filter((l) => endsWithNumber.test(l)).length;
  if (rawLines.length === 0 || withNumberCount / rawLines.length < 0.15) return rawLines;
  const rows = [];
  let buffer = "";
  rawLines.forEach((line) => {
    buffer = buffer ? buffer + " " + line : line;
    if (endsWithNumber.test(line)) { rows.push(buffer.trim()); buffer = ""; }
  });
  if (buffer.trim()) rows.push(buffer.trim());
  return rows;

}
// Asigna cada linea del PDF a como maximo UN producto del catalogo (y viceversa),
// tomando primero los pares con mejor puntaje. Evita que varios productos distintos
// reclamen la misma linea (lo que generaba filas duplicadas/espurias).
function greedyMatchProductsToLines(products, lines) {
  // Precalcula tokenizacion/normalizacion UNA vez por producto y UNA vez por linea,
  // en vez de repetirla en cada combinacion (antes: productos x lineas veces).
  const prodPre = products.map((p) => {
    const label = p.producto + (p.marca ? " " + p.marca : "");
    return { tokens: tokenize(label), norm: normalizeTextForMatch(label) };
  });
  const linePre = lines.map((line) => ({ tokenSet: new Set(tokenize(line)), norm: normalizeTextForMatch(line) }));
  const pairs = [];
  products.forEach((p, pIdx) => {
    const pp = prodPre[pIdx];
    linePre.forEach((lp, lIdx) => {
      const r = matchScorePrecomputed(pp.tokens, pp.norm, lp.tokenSet, lp.norm);
      if (r.score >= 0.35) pairs.push({ pIdx, lIdx, score: r.score, hits: r.hits });
    });
  });
  pairs.sort((a, b) => b.score - a.score || b.hits - a.hits);
  const usedProduct = new Set(), usedLine = new Set(), results = [];
  pairs.forEach((pair) => {
    if (usedProduct.has(pair.pIdx) || usedLine.has(pair.lIdx)) return;
    usedProduct.add(pair.pIdx); usedLine.add(pair.lIdx);
    const p = products[pair.pIdx];
    results.push({
      productId: p.id, producto: p.producto, marca: p.marca, categoria: p.categoria, unidad: p.unidad,
      costoUnitario: p.costPerUnit, codigo: p.codigo || "", matchedLine: lines[pair.lIdx], score: pair.score, hits: pair.hits
    });
  });
  // lineas que parecen filas de datos reales (tienen letras y numeros, largo razonable)
  // pero no quedaron asignadas a ningun producto del catalogo
  const unmatchedLines = lines
    .map((line, idx) => ({ line, idx }))
    .filter(({ line, idx }) => !usedLine.has(idx) && line.length >= 6 && /[a-zA-Z]/.test(line) && /\d/.test(line))
    .map(({ line }) => line);
  return { matched: results, unmatchedLines };
}
async function handleImportPdf(file) {

    const availableProducts = state.products.filter((p) => !state.items.some((it) => it.productId === p.id));
    const { matched } = greedyMatchProductsToLines(availableProducts, lines);
    const matches = matched.map((m) => ({ ...m, selected: m.score >= 0.6 }));
    state.importMatches = matches.slice(0, 150);
    state.importStatus = matches.length > 0
      ? { state: "ok", msg: t("import_found", { n: matches.length, l: lines.length }) }
      : { state: "error", msg: t("import_none_found", { l: lines.length, c: state.products.length }) };

}

async function handleTransferPdf(file) {

    // transferencia no se habia creado, llevando a crearla dos veces por error.

// a Entradas de este punto, se marca esa transferencia como "rechazada" (no queda pendiente
// para siempre) y se devuelve la cantidad al stock del punto de origen.
async function rejectTransferItem(id) {
  const tr = state.pendingTransfers.find((t) => t.id === id);
  if (!tr) return;
  if (!window.confirm(translate("transfer_reject_confirm", { producto: tr.producto }))) return;
  state.confirmTransferStatus = { state: "loading", msg: t("saving") };
  rerender();
  try {
    await ensureFirebaseAuth();
    await db.collection("transferencias").doc(id).set({ estado: "rechazada", timestampConfirmado: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
    if (tr.puntoOrigen) {
      try { await returnToOriginStock(tr.puntoOrigen, tr.fecha, tr); } catch (e) {}
    }
    state.pendingTransfers = state.pendingTransfers.filter((t) => t.id !== id);
    state.confirmTransferStatus = { state: "ok", msg: t("transfer_item_rejected", { producto: tr.producto }) };
  } catch (e) {

async function confirmPendingTransfers() {
  if (state.pendingTransfers.length === 0) return;
  state.confirmTransferStatus = { state: "loading", msg: t("saving") };
  rerender();
  try {
    const itemsToConfirm = state.pendingTransfers.map((it) => ({ id: it.id, cantidadRecibida: parseNumber(it.recibidoInput) }));
    await confirmTransfersInFirestore(itemsToConfirm);
    // aplica lo recibido a "Entradas" del item correspondiente (lo suma si ya existia algo escrito)
    // se construye directo desde los datos de la transferencia -- funciona igual si el
    // producto viene del catalogo o si fue agregado manualmente (sin match) en Admin.
    state.pendingTransfers.forEach((tr) => {
      const recibido = parseNumber(tr.recibidoInput);
      let it = state.items.find((i) => i.productId === tr.productoId);
      if (!it) {
        it = {
          key: `it-transfer-${tr.id}`,
          productId: tr.productoId, producto: tr.producto, marca: tr.marca, categoria: tr.categoria || "", codigo: tr.codigo || "",
          unidad: tr.unidad || "und", modo: "each", mlPorUnidad: 0, costoUnitario: tr.costoUnitario || 0,
          inicialInput: "0", entradasInput: "0", finalInput: "", pedidoInput: ""
        };
        state.items.unshift(it);
      }
      it.entradasInput = String((parseNumber(it.entradasInput) || 0) + recibido);
      computeItem(it);
    });
    // si lo recibido no coincide con lo enviado en algun producto, avisa por correo
    const discrepancies = state.pendingTransfers
      .map((tr) => ({ producto: tr.producto, marca: tr.marca, enviado: tr.cantidadEnviada, recibido: parseNumber(tr.recibidoInput), diferencia: parseNumber(tr.recibidoInput) - tr.cantidadEnviada }))
      .filter((d) => d.diferencia !== 0);
    if (discrepancies.length > 0) {
      enviarAlertaDiferenciaTransferencia(discrepancies);
      state.confirmTransferStatus = { state: "ok", msg: t("transfer_confirmed") + " " + t("transfer_discrepancy_alert_sent") };
    } else {
      state.confirmTransferStatus = { state: "ok", msg: t("transfer_confirmed") };
    }
    state.pendingTransfers = [];
  } catch (e) {
    state.confirmTransferStatus = { state: "error", msg: t("save_failed", { msg: e.message }) };
  }
  rerender();
}
async function enviarAlertaDiferenciaTransferencia(discrepancies) {
  try {
    const payload = {
      action: "sendTransferDiscrepancyAlert", to: ORDER_EMAIL,
      punto: state.selectedPunto, fecha: state.fecha,
      items: discrepancies.map((d) => ({ producto: d.producto, marca: d.marca || "", enviado: d.enviado, recibido: d.recibido, diferencia: d.diferencia }))
    };
    await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
  } catch (e) {
    // silencioso: no bloquea la confirmacion de la transferencia si esto falla
  }
}

function addItemFromProduct(prod) {
  if (state.items.some((it) => it.productId === prod.id)) return; // evita duplicados
  const menuCfg = (state.pointMenu[state.selectedPunto] || {})[prod.id];
  const defaultInicial = menuCfg && menuCfg.cantidadDefault ? String(menuCfg.cantidadDefault) : "0";
  const it = {
    key: `it-${prod.id}-${Date.now()}`,
    productId: prod.id, producto: prod.producto, marca: prod.marca, categoria: prod.categoria, codigo: prod.codigo || "",
    unidad: prod.unidad, modo: prod.modo, mlPorUnidad: prod.mlPorUnidad, costoUnitario: prod.costPerUnit, priceInvalid: !!prod.priceInvalid,
    inicialInput: defaultInicial, entradasInput: "", finalInput: "", pedidoInput: ""
  };
  computeItem(it);
  state.items.unshift(it);
}

function computeItem(it) {
  it.entradas = parseNumber(it.entradasInput);
  it.final = parseNumber(it.finalInput);
  it.inicial = parseNumber(it.inicialInput);
  it.pedido = parseNumber(it.pedidoInput);
  it.transferSalida = it.transferTotal || 0;
  // Consumo real = lo disponible (Inicial+Entradas) menos lo que quedo (Final) menos lo que
  // salio por transferencia a otro punto (no fue consumido aqui, solo cambio de lugar).
  it.consumo = it.inicial + it.entradas - it.final - it.transferSalida;
  // El "Final" contado no puede ser mayor que lo que habia disponible (Inicial + Entradas);
  // si pasa, el consumo da negativo, lo cual es imposible logicamente -- se marca como excedente.
  it.excess = it.finalInput !== "" && it.consumo < 0;
  it.costoConsumo = it.consumo * (it.costoUnitario || 0);
  it.consumoMl = it.modo === "each" ? it.consumo * (it.mlPorUnidad || 0) : (it.unidad === "ml" ? it.consumo : 0);
  it.consumoG = it.modo === "medida" && it.unidad === "g" ? it.consumo : 0;
}

async function loadPuntoInicial() {
  if (!state.selectedPunto) { state.saveStatus = { state: "error", msg: t("choose_pos_error") }; rerender(); return; }
  state.saveStatus = { state: "loading", msg: t("validating_pin") };
  rerender();
  if (state.puntos.length === 0) { await loadPuntos(); }
  // el PIN se valida localmente contra los datos ya cargados de Firestore (Fase 1) --
  // ya no depende de la hoja de Google Sheets para esto.
  const enteredPin = state.pin.trim();
  const pinOk = enteredPin === MASTER_PIN || (state.puntoPins[state.selectedPunto] && enteredPin === state.puntoPins[state.selectedPunto]);
  if (!pinOk) {
    state.pinValidated = false;
    state.saveStatus = { state: "error", msg: t("pin_error", { pos: state.selectedPunto }) };
    rerender();
    return;
  }
  try {
    delete state.pointMenu[state.selectedPunto];
    const [currentItems, puntoStatus, pending] = await Promise.all([
      fetchCurrentState(state.selectedPunto),
      fetchPuntoStatus(state.selectedPunto),
      fetchPendingTransfers(state.selectedPunto),
      loadPointMenu(state.selectedPunto),
      loadClientesAdultosNinos(),
      fetchTipoCambio(TODAY).then((rate) => { state.tipoCambioEurUsd = rate; })
    ]);
    state.pinValidated = true;
    // si hay una jornada abierta (apertura sin cerrar) se sigue trabajando en ESA fecha,
    // sin importar que dia sea hoy -- asi no se "pierde" al recargar la app pasada la
    // medianoche. Solo se considera "cerrado hoy" cuando no hay jornada abierta pendiente.
    const jornadaAbierta = puntoStatus.fechaJornadaAbierta || "";
    const workingFecha = jornadaAbierta || TODAY;
    state.fecha = workingFecha;
    state.jornadaAbierta = !!jornadaAbierta;
    const closedToday = !jornadaAbierta && puntoStatus.fechaUltimoCierre === TODAY;
    const todayDetail = await fetchReportDetail(workingFecha, state.selectedPunto);
    const currentByProduct = {};
    currentItems.forEach((it) => { currentByProduct[it.productoId] = it; });
    const todayByProduct = {};
    todayDetail.items.forEach((it) => { todayByProduct[it.productoId] = it; });
    const allProductIds = new Set([...Object.keys(currentByProduct), ...Object.keys(todayByProduct)]);
    const items = Array.from(allProductIds).map((pid) => {
      const today = todayByProduct[pid];
      const base = currentByProduct[pid];
      const src = today || base;
      return {
        key: `it-${pid}`,
        productId: pid, producto: src.producto, marca: src.marca, categoria: src.categoria, codigo: src.codigo || "",
        unidad: src.unidad, modo: src.modo || "medida", mlPorUnidad: 0, costoUnitario: src.costoUnitario,
        inicialInput: String((today && today.inicial !== undefined ? today.inicial : (base ? base.inicial : 0)) || 0),
        entradasInput: today ? String(today.entradas || 0) : "",
        finalInput: (today && today.final) ? String(today.final) : "",
        pedidoInput: (today && today.pedido) ? String(today.pedido) : "",
        transferTotal: (today && today.transferSalida) ? Number(today.transferSalida) : 0
      };
    });
    items.forEach(computeItem);
    state.items = items;
    state.saveStatus = { state: "ok", msg: t("initial_loaded", { n: items.length }) };
    state.initialLocked = true;
    state.captureAlreadyClosedToday = closedToday;
    state.captureUnlockedByAdmin = false;
    state.pendingTransfers = pending.map((it) => ({ ...it, recibidoInput: String(it.cantidadEnviada) }));
    state.pendingTransfersLoaded = true;
  } catch (e) {
    state.saveStatus = { state: "error", msg: t("generic_error", { msg: e.message }) };
  }
  rerender();
}

function computeControlItem(it) {
  it.conteoReal = it.conteoInput === "" ? null : parseNumber(it.conteoInput);
  if (it.conteoReal === null) { it.diferencia = null; it.costoDif = null; return; }
  it.diferencia = it.esperado - it.conteoReal; // positivo = falta stock, negativo = sobra stock
  it.costoDif = it.diferencia * (it.costoUnitario || 0);

async function guardarIPV() {
  if (!state.pinValidated) { state.saveStatus = { state: "error", msg: t("must_load_initial") }; rerender(); return; }
  if (state.fecha < TODAY && !state.jornadaAbierta) { state.saveStatus = { state: "error", msg: t("past_date_error") }; rerender(); return; }
  // salvaguarda: si ya cerro hoy y no esta desbloqueado por admin (presencial o remoto),
  // no continuar (la UI ya esconde el boton en este caso, esto es una segunda barrera).
  if (state.captureAlreadyClosedToday && !((state.sessionMode === "master" && state.captureUnlockedByAdmin) || (state.sessionMode === "point" && state.puntoReapertura[state.selectedPunto]))) {
    state.saveStatus = { state: "error", msg: t("closed_today_title") };
    rerender();
    return;
  }
  // Cierre de jornada: todo producto con movimiento (Inicial o Entradas > 0) necesita Final.
  const conMovimientoSinFinal = state.items.filter((it) => it.producto && (it.inicial > 0 || it.entradas > 0) && it.finalInput.trim() === "");
  if (conMovimientoSinFinal.length > 0) {
    state.saveStatus = { state: "error", msg: t("cierre_missing_final", { n: conMovimientoSinFinal.length, ejemplo: conMovimientoSinFinal[0].producto }) };
    rerender();
    return;
  }
  const itemsToSave = state.items.filter((it) => it.producto).map((it) => ({
    productId: it.productId, codigo: it.codigo || "", producto: it.producto, marca: it.marca, categoria: it.categoria || "",
    unidad: it.unidad, modo: it.modo, inicial: it.inicial, entradas: it.entradas, final: it.final,
    consumo: it.consumo, costoUnitario: it.costoUnitario, costoConsumo: it.costoConsumo,
    consumoMl: it.consumoMl, consumoG: it.consumoG, pedido: it.pedido || 0, transferSalida: it.transferSalida || 0
  }));
  const orderRows = state.items.filter((it) => it.producto && (it.pedido || 0) > 0);
  state.saveStatus = { state: "loading", msg: t("saving") };
  rerender();
  try {
    await saveCierreBatch(state.selectedPunto, state.fecha, state.responsable, itemsToSave);
    let orderMsg = "";
    let orderSent = false;
    if (orderRows.length > 0) {
      const orderResult = await enviarPedidoEmail(orderRows);
      orderMsg = orderResult.ok ? t("order_sent") : (t("order_send_error") + " (" + orderResult.msg + ")");
      orderSent = orderResult.ok;
    } else {
      await enviarAlertaSinPedido();
      orderMsg = t("no_order_alert_sent");
      orderSent = false;
    }
    // se deja el IPV tal cual quedo guardado (Inicial/Entradas/Final/Pedido) -- el dia
    // queda bloqueado de inmediato, asi que no hace falta "preparar" un proximo conteo.
    const guardadosN = itemsToSave.length, guardadosPos = state.selectedPunto, guardadosFecha = state.fecha;
    state.responsable = "";
    state.saveStatus = { state: "ok", msg: t("jornada_cerrada_ok", { n: guardadosN, pos: guardadosPos, date: guardadosFecha }) + orderMsg };
    state.initialLocked = true;
    state.captureAlreadyClosedToday = true;
    state.jornadaAbierta = false;
    state.fecha = TODAY;
    if (state.sessionMode === "point" && state.puntoReapertura[state.selectedPunto]) {
      state.puntoReapertura[state.selectedPunto] = false;
      const docId = state.puntoDocIds[state.selectedPunto];
      if (docId) { db.collection("puntos").doc(docId).set({ reAperturaAutorizada: false }, { merge: true }).catch(() => {}); }
    }
    if (state.sessionMode === "point") {
      state.shiftClosedInfo = { pos: guardadosPos, n: guardadosN, date: guardadosFecha, orderSent };
      setTimeout(() => { if (state.shiftClosedInfo) resetSession(); }, 6000);
    }
  } catch (e) {
    state.saveStatus = { state: "error", msg: t("save_failed", { msg: e.message }) };
  }
  rerender();
}
// Apertura: registra Inicial + Entradas sin exigir Final ni bloquear el dia. Se puede hacer
// cuantas veces se quiera (varias entregas a distintas horas) -- cada vez que se abre la
// pantalla se recarga el total acumulado de hoy, y esta funcion vuelve a guardarlo.
// Transferencia inmediata de un solo producto, hecha por el personal regular (no requiere
// Admin) mientras hace su Apertura o Cierre -- ej. mover bebida a otro punto en lo que llega
// el pedido. Se crea la transferencia pendiente (el destino la confirma o rechaza igual que
// las de Admin) y se acumula en "transferSalida" de este producto hoy, para que el Consumo
// real no la cuente como si se hubiera consumido aqui.
async function enviarTransferenciaItem(itemKey) {
  const it = state.items.find((i) => i.key === itemKey);
  if (!it || !it.transferDestino) return;
  const cantidad = parseNumber(it.transferInput);
  if (cantidad <= 0) { window.alert(translate("transfer_item_invalid_qty")); return; }
  const destino = it.transferDestino;
  it.transferSending = true;
  rerender();
  try {
    await ensureFirebaseAuth();
    await createTransferInFirestore(destino, state.selectedPunto, state.fecha, [{
      productoId: it.productId, producto: it.producto, marca: it.marca, categoria: it.categoria,
      unidad: it.unidad, costoUnitario: it.costoUnitario, codigo: it.codigo || "", cantidadEnviada: cantidad
    }]);
    const logId = `${state.fecha}_${state.selectedPunto}_${it.productId}`;
    await db.collection("logEntries").doc(logId).set({
      fecha: state.fecha, punto: state.selectedPunto, productoId: it.productId, producto: it.producto,
      marca: it.marca || "", categoria: it.categoria || "", unidad: it.unidad, costoUnitario: it.costoUnitario, codigo: it.codigo || "",
      inicial: it.inicial, transferSalida: firebase.firestore.FieldValue.increment(cantidad)
    }, { merge: true });
    it.transferTotal = (it.transferTotal || 0) + cantidad;
    computeItem(it);
    it.transferOpen = false; it.transferDestino = ""; it.transferInput = ""; it.transferSending = false;
    state.saveStatus = { state: "ok", msg: t("transfer_item_sent", { n: fmt2(cantidad), producto: it.producto, pos: destino }) };
  } catch (e) {
    it.transferSending = false;
    window.alert(translate("save_failed", { msg: e.message }));
  }
  rerender();
}

async function adminSaveSources() {
  state.adminStatus = { state: "loading", msg: t("admin_saving") };
  rerender();
  try {
    await ensureFirebaseAuth();
    const batch = db.batch();
    const keptDocIds = new Set();
    state.adminSources.filter((s) => s.url).forEach((s) => {
      const data = { label: s.label, url: s.url };
      if (s.docId) { batch.set(db.collection("fuentes").doc(s.docId), data); keptDocIds.add(s.docId); }
      else { const ref = db.collection("fuentes").doc(); batch.set(ref, data); s.docId = ref.id; keptDocIds.add(ref.id); }
    });
    const snap = await db.collection("fuentes").get();
    snap.forEach((doc) => { if (!keptDocIds.has(doc.id)) batch.delete(doc.ref); });
    await batch.commit();
    state.adminStatus = { state: "ok", msg: t("admin_saved", { n: keptDocIds.size }) };
    loadSourcesAndProducts();
  } catch (e) {
    state.adminStatus = { state: "error", msg: t("admin_save_error", { msg: e.message }) };

function adminLoadUbicaciones() {
  state.ubicacionesList = (state.puntoUbicaciones[state.ubicacionesPunto] || []).map((nombre, idx) => ({ id: "ub" + idx, nombre }));
  state.ubicacionesStatus = { state: "idle", msg: "" };
  rerender();
}
async function adminSaveUbicaciones() {
  if (!state.ubicacionesPunto) return;
  const docId = state.puntoDocIds[state.ubicacionesPunto];
  if (!docId) return;
  state.ubicacionesStatus = { state: "loading", msg: t("admin_saving") };
  rerender();
  try {
    await ensureFirebaseAuth();
    const nombres = state.ubicacionesList.map((u) => u.nombre.trim()).filter((n) => n);
    await db.collection("puntos").doc(docId).set({ ubicacionesFinal: nombres }, { merge: true });
    state.puntoUbicaciones[state.ubicacionesPunto] = nombres;
    state.ubicacionesStatus = { state: "ok", msg: t("ubicaciones_saved", { n: nombres.length, pos: state.ubicacionesPunto }) };
  } catch (e) {
    state.ubicacionesStatus = { state: "error", msg: t("save_failed", { msg: e.message }) };
  }
  rerender();
}
async function adminLoadAlertEmails() {
  try {
    const res = await fetch(`${API_URL}?action=getAlertEmails&adminPass=${encodeURIComponent(ADMIN_PASS)}`, { cache: "no-store" });
    const data = await res.json();
    if (data.error) { state.adminAlertEmailsStatus = { state: "error", msg: data.error }; rerender(); return; }
    state.adminAlertEmails = (data.emails || []).map((e, idx) => ({ id: "ae" + idx, email: e.email, pedido: e.pedido, diferencia: e.diferencia, transferencia: e.transferencia }));
    if (state.adminAlertEmails.length === 0) state.adminAlertEmails = [{ id: "ae0", email: "", pedido: true, diferencia: true, transferencia: true }];
  } catch (e) {
    state.adminAlertEmailsStatus = { state: "error", msg: t("generic_error", { msg: e.message }) };
  }
  rerender();
}
async function adminSaveAlertEmails() {
  state.adminAlertEmailsStatus = { state: "loading", msg: t("admin_saving") };
  rerender();
  try {
    const payload = {
      action: "saveAlertEmails", adminPass: ADMIN_PASS,
      emails: state.adminAlertEmails.filter((e) => e.email.trim()).map((e) => ({ email: e.email.trim(), pedido: !!e.pedido, diferencia: !!e.diferencia, transferencia: !!e.transferencia }))
    };
    const res = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    const data = await res.json();
    if (data.error) state.adminAlertEmailsStatus = { state: "error", msg: data.error };
    else state.adminAlertEmailsStatus = { state: "ok", msg: t("admin_alert_emails_saved", { n: data.guardados }) };
  } catch (e) {
    state.adminAlertEmailsStatus = { state: "error", msg: t("admin_save_error", { msg: e.message }) };
  }
  rerender();
}
/* ---------- menu por punto (que productos se ven en cada punto y cantidad inicial por defecto) ---------- */
async function adminLoadMenu() {
  if (!state.menuPunto || !state.menuCategoria) { state.menuItems = []; rerender(); return; }
  state.menuStatus = { state: "loading", msg: t("admin_loading") };
  rerender();
  try {
    await ensureFirebaseAuth();
    const snap = await db.collection("menuPuntos").where("punto", "==", state.menuPunto).get();
    const configByProduct = {};
    snap.forEach((doc) => { const d = doc.data(); configByProduct[d.productoId] = { ...d, docId: doc.id }; });
    state.menuItems = state.products
      .filter((p) => p.categoria === state.menuCategoria)
      .map((p) => {
        const cfg = configByProduct[p.id];
        return { productId: p.id, producto: p.producto, marca: p.marca, unidad: p.unidad, enabled: cfg ? cfg.enabled : true, cantidadDefaultInput: cfg && cfg.cantidadDefault ? String(cfg.cantidadDefault) : "", docId: cfg ? cfg.docId : null };
      });
    state.menuStatus = { state: "idle", msg: "" };
  } catch (e) {
    state.menuStatus = { state: "error", msg: t("generic_error", { msg: e.message }) };
  }
  rerender();
}
async function adminSaveMenu() {
  if (!state.menuPunto) return;
  state.menuStatus = { state: "loading", msg: t("admin_saving") };
  rerender();
  try {
    await ensureFirebaseAuth();
    const batch = db.batch();
    state.menuItems.forEach((it) => {
      const cantidadDefault = parseNumber(it.cantidadDefaultInput);
      const interesting = it.enabled === false || cantidadDefault > 0;
      if (it.docId) {
        if (interesting) batch.set(db.collection("menuPuntos").doc(it.docId), { punto: state.menuPunto, productoId: it.productId, enabled: it.enabled, cantidadDefault });
        else batch.delete(db.collection("menuPuntos").doc(it.docId));
      } else if (interesting) {
        const ref = db.collection("menuPuntos").doc();
        batch.set(ref, { punto: state.menuPunto, productoId: it.productId, enabled: it.enabled, cantidadDefault });
        it.docId = ref.id;
      }
    });
    await batch.commit();
    state.menuStatus = { state: "ok", msg: t("menu_saved", { n: state.menuItems.length }) };
    delete state.pointMenu[state.menuPunto];
  } catch (e) {
    state.menuStatus = { state: "error", msg: t("admin_save_error", { msg: e.message }) };
  }
  rerender();
}
async function resetMenuSelection() {
  if (state.menuItems.length === 0) return;
  if (!window.confirm(t("menu_reset_confirm"))) return;
  state.menuItems.forEach((it) => { it.enabled = true; it.cantidadDefaultInput = ""; });
  await adminSaveMenu();
}
async function loadPointMenu(punto) {
  if (!punto || state.pointMenu[punto]) return;
  try {
    await ensureFirebaseAuth();
    const snap = await db.collection("menuPuntos").where("punto", "==", punto).get();
    const map = {};
    snap.forEach((doc) => { const d = doc.data(); map[d.productoId] = d; });
    state.pointMenu[punto] = map;
  } catch (e) {
    state.pointMenu[punto] = {};
  }
  rerender();
}

const SCROLL_PRESERVE_IDS = ["match-list-scroll", "picker-results-captura", "picker-results-control", "transfer-match-list-scroll", "menu-list-scroll", "transfer-manual-results"];
function rerender() {
  const active = document.activeElement;
  const activeId = active && active.id;
  let selStart = null, selEnd = null;
  const selectableTypes = ["text", "search", "tel", "url", "password"];
  try {
    if (active && (active.tagName === "TEXTAREA" || (active.tagName === "INPUT" && selectableTypes.includes(active.type)))) {
      selStart = active.selectionStart;
      selEnd = active.selectionEnd;
    }
  } catch (e) {}
  const winScrollY = window.scrollY;
  const scrollTops = {};
  SCROLL_PRESERVE_IDS.forEach((id) => {
    const el = document.getElementById(id);
    if (el) scrollTops[id] = el.scrollTop;
  });
  render();
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart !== null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
    }
  }
  Object.keys(scrollTops).forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.scrollTop = scrollTops[id];
  });
  window.scrollTo(0, winScrollY);
}

  const action = t.dataset.action, key = t.dataset.key;
  if (action === "tab") {

    const it = state.controlItems.find((i) => i.key === key);

    rerender();

  else if (action === "transfer-toggle-all") {
    const allSelected = state.transferMatches.every((m) => m.selected);
    state.transferMatches.forEach((m) => { m.selected = !allSelected; });
    rerender();
  }
  else if (action === "transfer-create") { createTransferFromMatches(); }
  else if (action === "transfer-confirm") { confirmPendingTransfers(); }
  else if (action === "transfer-reject-item") { rejectTransferItem(key); }
  else if (action === "transfer-unmatched-open") {

});

document.addEventListener("input", (e) => {

  if (action === "pin-input") { state.pin = el.value; rerender(); }
  else if (action === "gate-pin-input") { state.gatePin = el.value; rerender(); }
  else if (action === "responsable-input") { state.responsable = el.value; rerender(); }
  else if (action === "admin-clientes-adultos") { state.adultosInput = el.value; rerender(); }
  else if (action === "admin-clientes-ninos") { state.ninosInput = el.value; rerender(); }
  else if (action === "picker-search") { state.pickerText = el.value; state.pickerHighlightIndex = -1; rerender(); }
  else if (action === "import-edit-search") { state.importEditSearchText = el.value; rerender(); }
  else if (action === "items-filter") { state.itemsFilterText = el.value; rerender(); }
  else if (action === "menu-filter-search") { state.menuFilterText = el.value; rerender(); }
  else if (action === "item-inicial") { const it = state.items.find((i) => i.key === key); if (it) { it.inicialInput = el.value; computeItem(it); } rerender(); }
  else if (action === "item-entradas") { const it = state.items.find((i) => i.key === key); if (it) { it.entradasInput = el.value; computeItem(it); } rerender(); }
  else if (action === "item-final") { const it = state.items.find((i) => i.key === key); if (it) { it.finalInput = el.value; computeItem(it); } rerender(); }
  else if (action === "item-final-ubicacion") {
    const it = state.items.find((i) => i.key === key);
    if (it) {
      if (!it.finalPorUbicacion) it.finalPorUbicacion = [];
      it.finalPorUbicacion[Number(el.dataset.idx)] = el.value;
      const suma = it.finalPorUbicacion.reduce((s, v) => s + parseNumber(v), 0);
      it.finalInput = String(suma);
      computeItem(it);
    }
    rerender();
  }
  else if (action === "item-pedido") { const it = state.items.find((i) => i.key === key); if (it) { it.pedidoInput = el.value; computeItem(it); } rerender(); }
  else if (action === "item-transfer-qty") { const it = state.items.find((i) => i.key === key); if (it) it.transferInput = el.value; rerender(); }
  else if (action === "admin-pass-input") { state.adminPassInput = el.value; rerender(); }
  else if (action === "admin-label") { const s = state.adminSources.find((ss) => ss.id === key); if (s) s.label = el.value; rerender(); }
  else if (action === "hotel-name-input") { state.hotelNameInput = el.value; rerender(); }
  else if (action === "master-pin-admin-pass") { state.masterPinAdminPass = el.value; rerender(); }
  else if (action === "master-pin-new") { state.masterPinNew = el.value; rerender(); }
  else if (action === "master-pin-confirm") { state.masterPinConfirm = el.value; rerender(); }
  else if (action === "admin-url") { const s = state.adminSources.find((ss) => ss.id === key); if (s) s.url = el.value; rerender(); }
  else if (action === "admin-punto-nombre") { const p = state.adminPuntos.find((pp) => pp.id === key); if (p) p.punto = el.value; rerender(); }
  else if (action === "admin-punto-pin") { const p = state.adminPuntos.find((pp) => pp.id === key); if (p) p.pin = el.value; rerender(); }
  else if (action === "admin-punto-ratio") { const p = state.adminPuntos.find((pp) => pp.id === key); if (p) p.ratioUsdInput = el.value; rerender(); }
  else if (action === "admin-punto-peso") { const p = state.adminPuntos.find((pp) => pp.id === key); if (p) p.pesoBaseInput = el.value; rerender(); }
  else if (action === "admin-alert-email") { const e2 = state.adminAlertEmails.find((e) => e.id === key); if (e2) e2.email = el.value; rerender(); }
  else if (action === "menu-default-qty") { const it = state.menuItems.find((i) => i.productId === key); if (it) it.cantidadDefaultInput = el.value; rerender(); }
  else if (action === "control-responsable") { state.controlResponsable = el.value; rerender(); }
  else if (action === "control-picker-search") { state.controlPickerText = el.value; rerender(); }
  else if (action === "control-count") { const it = state.controlItems.find((i) => i.key === key); if (it) { it.conteoInput = el.value; computeControlItem(it); } rerender(); }
  else if (action === "transfer-match-solicitada") { const m = state.transferMatches.find((mm) => mm.productId === key); if (m) m.solicitadaInput = el.value; rerender(); }
  else if (action === "transfer-match-despachada") { const m = state.transferMatches.find((mm) => mm.productId === key); if (m) m.despachadaInput = el.value; rerender(); }

  else if (action === "transfer-unmatched-search") { state.transferUnmatchedSearchText = el.value; rerender(); }
  else if (action === "transfer-manual-nombre") { state.transferManualNombre = el.value; rerender(); }
  else if (action === "transfer-manual-picker-search") { state.transferManualPickerText = el.value; state.transferManualHighlightIndex = -1; rerender(); }

document.addEventListener("change", (e) => {
  const el = e.target, action = el.dataset && el.dataset.action, key = el.dataset && el.dataset.key;
  if (action === "select-punto") {
    state.selectedPunto = el.value; state.pinValidated = false; state.pendingTransfers = []; state.pendingTransfersLoaded = false;
    state.captureAlreadyClosedToday = false; state.captureUnlockedByAdmin = false; state.masterViewOnly = true; state.hideZeroItems = true; state.jornadaAbierta = false;
    if (state.sessionMode === "master" && state.selectedPunto && state.pin.trim() === MASTER_PIN) { loadPuntoInicial(); }
    else rerender();
  }
  else if (action === "gate-select-punto") { state.gatePunto = el.value; rerender(); }
  else if (action === "fecha-input") { state.fecha = el.value < TODAY ? TODAY : el.value; rerender(); }
  else if (action === "score-date") { state.scoreDate = el.value; rerender(); }
  else if (action === "order-suggestion-select-punto") { state.orderSuggestionPunto = el.value; state.orderSuggestionData = null; rerender(); }
  else if (action === "picker-cat") { state.pickerCat = el.value; state.pickerHighlightIndex = -1; rerender(); }

  else if (action === "control-picker-cat") { state.controlPickerCat = el.value; rerender(); }

});

// Navegacion por teclado en el buscador de "Productos del dia": flechas para moverse
// entre resultados, Enter para agregar el resaltado y saltar directo a escribir su
// cantidad Inicial; Enter de nuevo ahi regresa el foco al buscador para seguir agregando.
document.addEventListener("keydown", (e) => {
  const el = e.target;
  if (el && el.id === "picker-search") {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp" && e.key !== "Enter") return;
    const results = getCapturaPickerResults();
    if (results.length === 0) return;
    e.preventDefault();
    if (e.key === "ArrowDown") {
      state.pickerHighlightIndex = Math.min((state.pickerHighlightIndex < 0 ? -1 : state.pickerHighlightIndex) + 1, results.length - 1);
      rerender();
      const rows = document.querySelectorAll("#picker-results-captura .picker-row");
      if (rows[state.pickerHighlightIndex]) rows[state.pickerHighlightIndex].scrollIntoView({ block: "nearest" });
    } else if (e.key === "ArrowUp") {
      state.pickerHighlightIndex = Math.max(state.pickerHighlightIndex - 1, 0);
      rerender();
      const rows = document.querySelectorAll("#picker-results-captura .picker-row");
      if (rows[state.pickerHighlightIndex]) rows[state.pickerHighlightIndex].scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter") {
      const idx = state.pickerHighlightIndex >= 0 ? state.pickerHighlightIndex : 0;
      const prod = results[idx];
      if (!prod) return;
      addItemFromProduct(prod);
      state.pickerText = "";
      state.pickerHighlightIndex = -1;
      rerender();
      const targetItem = state.items.find((it) => it.productId === prod.id);
      if (targetItem) {
        const inicialEl = document.getElementById(`item-entradas-${targetItem.key}`);
        if (inicialEl) { inicialEl.focus(); inicialEl.select(); }
      }
    }
  } else if (el && el.dataset && el.dataset.action === "item-entradas" && e.key === "Enter") {
    e.preventDefault();
    el.blur();
    const searchEl = document.getElementById("picker-search");
    if (searchEl) searchEl.focus();
  } else if (el && el.id === "transfer-manual-picker-search") {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp" && e.key !== "Enter") return;
    const results = filterProductsFor({ filterText: state.transferManualPickerText }).slice(0, 20);
    if (results.length === 0) return;
    e.preventDefault();
    if (e.key === "ArrowDown") {
      state.transferManualHighlightIndex = Math.min((state.transferManualHighlightIndex < 0 ? -1 : state.transferManualHighlightIndex) + 1, results.length - 1);
      rerender();
      const rows = document.querySelectorAll("#transfer-manual-results .picker-row");
      if (rows[state.transferManualHighlightIndex]) rows[state.transferManualHighlightIndex].scrollIntoView({ block: "nearest" });
    } else if (e.key === "ArrowUp") {
      state.transferManualHighlightIndex = Math.max(state.transferManualHighlightIndex - 1, 0);
      rerender();
      const rows = document.querySelectorAll("#transfer-manual-results .picker-row");
      if (rows[state.transferManualHighlightIndex]) rows[state.transferManualHighlightIndex].scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter") {
      const idx = state.transferManualHighlightIndex >= 0 ? state.transferManualHighlightIndex : 0;
      const prod = results[idx];
      if (!prod) return;
      addManualTransferProduct(prod);
      state.transferManualHighlightIndex = -1;
      rerender();
      const despEl = document.getElementById(`transfer-desp-${prod.id}`);
      if (despEl) { despEl.focus(); despEl.select(); }
    }
  } else if (el && el.dataset && el.dataset.action === "transfer-match-despachada" && e.key === "Enter") {
    e.preventDefault();
    el.blur();
    const searchEl = document.getElementById("transfer-manual-picker-search");
    if (searchEl) searchEl.focus();
  }
});

document.documentElement.lang = state.lang;
render();
loadSourcesAndProducts();
loadPuntos();
loadHotelName();

// Limpieza: elimina cualquier Service Worker/caché registrados por una version anterior de la app,
// para asegurar que siempre se cargue la version mas reciente de esta pagina.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister())).catch(() => {});
}
if (window.caches) {
  caches.keys().then((keys) => keys.forEach((k) => caches.delete(k))).catch(() => {});
}
